name: Architecture Guard & Drift Detection

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  architecture-check:
    name: Architecture Gate & Drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install arcade-agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/arcade-agent/arcade-agent.git#egg=arcade-agent[languages]"

      - name: Run Architecture Drift Detection
        id: drift
        run: |
          mkdir -p arcade-report
          arcade-arch-diff --source src --language java --baseline .arcade/baseline.json > arcade-report/drift-report.md 2>&1 || true
          cat arcade-report/drift-report.md

      - name: Checkout arcade-analyze Skill for Validation
        uses: actions/checkout@v4
        with:
          repository: arcade-agent/arcade-analyze-skill
          path: .arcade-skill

      - name: Validate Architecture Rules
        if: always()
        run: |
          python .arcade-skill/scripts/validate.py . \
            --rules .arcade-rules.json \
            --language java \
            --algorithm pkg \
            --output arcade-report/validation-report.md \
            --fail-on error

      - name: Post or Update PR Comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- arcade-agent-drift-report -->';
            let report = '';
            if (fs.existsSync('arcade-report/drift-report.md')) {
              report += fs.readFileSync('arcade-report/drift-report.md', 'utf8');
            }
            if (fs.existsSync('arcade-report/validation-report.md')) {
              report += '\n\n' + fs.readFileSync('arcade-report/validation-report.md', 'utf8');
            }
            if (!report) return;
            const body = report.includes(marker) ? report : `${report}\n${marker}`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Upload Architecture Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-reports
          path: |
            arcade-report/
            .arcade/baseline.json
          retention-days: 30
